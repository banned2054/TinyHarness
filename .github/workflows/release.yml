name: Package Windows x64

on:
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: package-windows-${{ github.ref }}
    cancel-in-progress: false

env:
    CODEX_REPOSITORY: banned2054/codex
    CODEX_REF: 1b647eac0adc5f31140340ffcc5d49b19a235fad
    DOTNET_NOLOGO: "true"
    DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
    build:
        name: Build, verify, and package CLI and Desktop
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}
        runs-on: windows-2025
        timeout-minutes: 90
        defaults:
            run:
                shell: pwsh
                working-directory: harness
        outputs:
            version: ${{ steps.metadata.outputs.version }}
            package_name: ${{ steps.metadata.outputs.package_name }}
            cli_package_name: ${{ steps.metadata.outputs.cli_package_name }}
            desktop_package_name: ${{ steps.metadata.outputs.desktop_package_name }}
        steps:
            - name: Initialize isolated build directories
              working-directory: .
              run: |
                  $ErrorActionPreference = 'Stop'
                  "CARGO_TARGET_DIR=$env:RUNNER_TEMP/codex-target" >> $env:GITHUB_ENV
                  "TINYHARNESS_USER_CONFIG_DIR=$env:RUNNER_TEMP/tinyharness-user-config" >> $env:GITHUB_ENV
                  "TINYHARNESS_SESSION_STORE_DIR=$env:RUNNER_TEMP/tinyharness-sessions" >> $env:GITHUB_ENV

            - name: Check out TinyHarness
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  path: harness
                  persist-credentials: false

            - name: Check out the pinned sandbox fork
              uses: actions/checkout@v7
              with:
                  repository: ${{ env.CODEX_REPOSITORY }}
                  ref: ${{ env.CODEX_REF }}
                  path: codex
                  persist-credentials: false

            - name: Set up .NET 10
              id: dotnet
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Select SDK and validate versions
              id: metadata
              env:
                  SELECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  if (Test-Path -LiteralPath global.json) {
                    throw 'A repository global.json now exists; reconcile the workflow SDK selection before releasing.'
                  }
                  # 避免 runner 上更高版本的预装 SDK 覆盖本轮选择。
                  @{ sdk = @{ version = $env:SELECTED_DOTNET_SDK; rollForward = 'disable' } } |
                    ConvertTo-Json -Depth 3 | Set-Content -LiteralPath global.json -Encoding utf8NoBOM
                  $version = (dotnet msbuild TinyHarness.Cli/TinyHarness.Cli.csproj -nologo -getProperty:Version | Out-String).Trim()
                  $coreVersion = (dotnet msbuild TinyHarness.Core/TinyHarness.Core.csproj -nologo -getProperty:Version | Out-String).Trim()
                  if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $version -ne $coreVersion) {
                    throw "CLI and Core must declare the same release version: CLI=$version, Core=$coreVersion"
                  }
                  if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
                    throw "Tag '$env:GITHUB_REF_NAME' does not match project version 'v$version'."
                  }
                  $forkCommit = (git -C ../codex rev-parse HEAD | Out-String).Trim()
                  if ($forkCommit -cne $env:CODEX_REF) { throw 'The sandbox checkout is not the pinned commit.' }
                  "version=$version" >> $env:GITHUB_OUTPUT
                  "package_name=TinyHarness-$version-win-x64" >> $env:GITHUB_OUTPUT
                  "cli_package_name=TinyHarness-CLI-$version-win-x64" >> $env:GITHUB_OUTPUT
                  "desktop_package_name=TinyHarness-Desktop-$version-win-x64" >> $env:GITHUB_OUTPUT
                  dotnet --info

            - name: Restore and test TinyHarness offline paths
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  dotnet restore TinyHarness.slnx
                  dotnet test TinyHarness.Tests/TinyHarness.Tests.csproj -c Release --no-restore `
                    --logger 'trx;LogFileName=offline.trx' --results-directory "$env:RUNNER_TEMP/test-results"
                  dotnet test TinyHarness.Desktop.Tests/TinyHarness.Desktop.Tests.csproj -c Release --no-restore `
                    --logger 'trx;LogFileName=desktop-offline.trx' --results-directory "$env:RUNNER_TEMP/test-results"

            - name: Publish CLI and Desktop NativeAOT
              env:
                  RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  dotnet publish TinyHarness.Cli/TinyHarness.Cli.csproj -c Release -r win-x64 `
                    --self-contained true -o "$env:RUNNER_TEMP/native/cli"
                  dotnet publish TinyHarness.Desktop/TinyHarness.Desktop.csproj -c Release -r win-x64 `
                    --self-contained true -p:Version=$env:RELEASE_VERSION -o "$env:RUNNER_TEMP/native/desktop"

            - name: Install the fork's Rust toolchain
              working-directory: codex/codex-rs
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  $toolchain = Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"'
                  if ($null -eq $toolchain -or @($toolchain).Count -ne 1) { throw 'Cannot determine the pinned Rust toolchain.' }
                  $channel = $toolchain.Matches[0].Groups[1].Value
                  rustup toolchain install $channel --profile minimal --component clippy --component rustfmt --component rust-src `
                    --target x86_64-pc-windows-msvc
                  rustc --version
                  cargo --version

            - name: Cache sandbox dependencies and build outputs
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ${{ runner.temp }}/codex-target
                  key: sandbox-windows-2025-msvc-${{ hashFiles('codex/codex-rs/Cargo.lock', 'codex/codex-rs/rust-toolchain.toml', 'codex/codex-rs/.cargo/config.toml') }}-${{ env.CODEX_REF }}
                  restore-keys: |
                      sandbox-windows-2025-msvc-${{ hashFiles('codex/codex-rs/Cargo.lock', 'codex/codex-rs/rust-toolchain.toml', 'codex/codex-rs/.cargo/config.toml') }}-

            - name: Build the three sandbox components
              working-directory: codex/codex-rs
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  cargo build --locked --release --target x86_64-pc-windows-msvc -p codex-windows-sandbox --bins

            - name: Assemble CLI and Desktop ZIPs and provenance
              env:
                  CLI_PACKAGE_NAME: ${{ steps.metadata.outputs.cli_package_name }}
                  DESKTOP_PACKAGE_NAME: ${{ steps.metadata.outputs.desktop_package_name }}
                  RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  $dist = Join-Path $env:RUNNER_TEMP 'dist'
                  $sandboxOutput = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release'
                  $sourceCommit = (git rev-parse HEAD | Out-String).Trim()
                  $sdk = (dotnet --version | Out-String).Trim()
                  Push-Location ../codex/codex-rs
                  try {
                    $rust = (rustc --version | Out-String).Trim()
                    $cargo = (cargo --version | Out-String).Trim()
                  } finally { Pop-Location }
                  New-Item -ItemType Directory -Path $dist | Out-Null
                  $checksums = foreach ($edition in @('CLI', 'Desktop')) {
                    $packageName = if ($edition -eq 'CLI') { $env:CLI_PACKAGE_NAME } else { $env:DESKTOP_PACKAGE_NAME }
                    $packageRoot = Join-Path $env:RUNNER_TEMP "package/$packageName"
                    if (Test-Path -LiteralPath $packageRoot) { throw "Package staging directory already exists: $packageName" }
                    New-Item -ItemType Directory -Path "$packageRoot/sandbox" | Out-Null
                    if ($edition -eq 'CLI') {
                      Copy-Item -LiteralPath "$env:RUNNER_TEMP/native/cli/TinyHarness.exe" -Destination $packageRoot
                      $readme = '.github/package-assets/README.txt'
                    } else {
                      $publishRoot = Join-Path $env:RUNNER_TEMP 'native/desktop'
                      # 仅重命名原生发布入口；内部程序集身份与测试引用保持一致。
                      Copy-Item -LiteralPath "$publishRoot/TinyHarness.Desktop.exe" -Destination "$packageRoot/TinyHarness.exe"
                      foreach ($file in Get-ChildItem -LiteralPath $publishRoot -Filter '*.dll' -File -Recurse) {
                        $relative = [IO.Path]::GetRelativePath($publishRoot, $file.FullName)
                        $destination = Join-Path $packageRoot $relative
                        New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
                        Copy-Item -LiteralPath $file.FullName -Destination $destination
                      }
                      foreach ($dependency in @('av_libglesv2.dll', 'libHarfBuzzSharp.dll', 'libonigwrap.dll', 'libSkiaSharp.dll')) {
                        if (-not (Test-Path -LiteralPath "$packageRoot/$dependency" -PathType Leaf)) {
                          throw "Desktop native dependency is missing: $dependency"
                        }
                      }
                      $readme = '.github/package-assets/README-desktop.txt'
                    }
                    Copy-Item -LiteralPath $readme -Destination "$packageRoot/README.txt"
                    foreach ($component in @('codex-windows-sandbox-setup.exe', 'codex-command-runner.exe', 'codex-windows-managed-deny-probe.exe')) {
                      Copy-Item -LiteralPath (Join-Path $sandboxOutput $component) -Destination "$packageRoot/sandbox"
                    }
                    Copy-Item -LiteralPath .github/package-assets/sandbox-settings.example.json -Destination $packageRoot
                    Copy-Item -LiteralPath LICENSE, NOTICE, THIRD-PARTY-LICENSES.txt -Destination $packageRoot
                    $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo("$packageRoot/TinyHarness.exe").ProductVersion
                    if ($productVersion.Split('+')[0] -cne $env:RELEASE_VERSION) {
                      throw "$edition native executable version '$productVersion' does not match '$env:RELEASE_VERSION'."
                    }
                    $fileHashes = [ordered]@{}
                    foreach ($file in Get-ChildItem -LiteralPath $packageRoot -File -Recurse | Sort-Object FullName) {
                      $relative = [IO.Path]::GetRelativePath($packageRoot, $file.FullName).Replace('\', '/')
                      $fileHashes[$relative] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                    }
                    [ordered]@{
                      version = $env:RELEASE_VERSION
                      edition = $edition
                      runtimeIdentifier = 'win-x64'
                      tinyHarness = @{ repository = $env:GITHUB_REPOSITORY; commit = $sourceCommit }
                      sandbox = @{ repository = $env:CODEX_REPOSITORY; commit = $env:CODEX_REF }
                      toolchains = @{ dotnetSdk = $sdk; rust = $rust; cargo = $cargo }
                      buildUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                      builtAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
                      files = $fileHashes
                    } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$packageRoot/build-info.json" -Encoding utf8NoBOM
                    $zipPath = Join-Path $dist "$packageName.zip"
                    Compress-Archive -LiteralPath $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal
                    $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
                    "$zipHash  $packageName.zip"
                  }
                  $checksums | Set-Content -LiteralPath "$dist/SHA256SUMS.txt" -Encoding ascii
                  @(
                    "# TinyHarness $env:RELEASE_VERSION - prototype preview"
                    ''
                    'Separate CLI and Desktop Windows x64 NativeAOT packages with the TinyHarness Codex-fork sandbox components.'
                    'Both packages contain TinyHarness.exe. Extract to separate directories; only add the CLI directory to PATH.'
                    'Unzip and read README.txt. Sandbox configuration and explicit provisioning are separate steps.'
                    'Automated checks cover CLI/Core and Desktop offline tests, CLI native smoke, and Desktop --offline-smoke.'
                    'This is not a real-provider, interactive GUI, or real Windows isolation acceptance run.'
                    ''
                    "TinyHarness commit: $sourceCommit"
                    "Sandbox fork: $env:CODEX_REPOSITORY@$env:CODEX_REF"
                    "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
                  ) | Set-Content -LiteralPath "$dist/RELEASE_NOTES.md" -Encoding utf8NoBOM

            - name: Verify both extracted packages outside the repositories
              timeout-minutes: 10
              env:
                  CLI_PACKAGE_NAME: ${{ steps.metadata.outputs.cli_package_name }}
                  DESKTOP_PACKAGE_NAME: ${{ steps.metadata.outputs.desktop_package_name }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $PSNativeCommandUseErrorActionPreference = $true
                  $extracted = Join-Path $env:RUNNER_TEMP 'extracted'
                  $smokeDirectory = Join-Path $env:RUNNER_TEMP 'native-smoke'
                  New-Item -ItemType Directory -Path $smokeDirectory | Out-Null
                  $configPath = (Resolve-Path -LiteralPath tinyharness.json).Path
                  foreach ($edition in @('CLI', 'Desktop')) {
                    $packageName = if ($edition -eq 'CLI') { $env:CLI_PACKAGE_NAME } else { $env:DESKTOP_PACKAGE_NAME }
                    $zipPath = Join-Path $env:RUNNER_TEMP "dist/$packageName.zip"
                    $checksum = (Get-Content -LiteralPath "$env:RUNNER_TEMP/dist/SHA256SUMS.txt" |
                      Where-Object { $_.EndsWith("  $packageName.zip", [StringComparison]::Ordinal) })
                    $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
                    if (@($checksum).Count -ne 1 -or $checksum -cne "$zipHash  $packageName.zip") {
                      throw "ZIP checksum mismatch: $packageName"
                    }
                    Expand-Archive -LiteralPath $zipPath -DestinationPath $extracted
                    $packageRoot = Join-Path $extracted $packageName
                    $manifest = Get-Content -LiteralPath "$packageRoot/build-info.json" -Raw | ConvertFrom-Json -AsHashtable
                    if ($manifest.edition -cne $edition) { throw "Package edition mismatch: $packageName" }
                    foreach ($entry in $manifest.files.GetEnumerator()) {
                      $hash = (Get-FileHash -LiteralPath (Join-Path $packageRoot $entry.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
                      if ($hash -cne $entry.Value) { throw "Extracted file hash mismatch: $packageName/$($entry.Key)" }
                    }
                    Push-Location $smokeDirectory
                    try {
                      if ($edition -eq 'CLI') {
                        & "$packageRoot/TinyHarness.exe" --help
                        & "$packageRoot/TinyHarness.exe" smoke --config $configPath
                      } else {
                        $stdout = Join-Path $smokeDirectory 'desktop-stdout.txt'
                        $stderr = Join-Path $smokeDirectory 'desktop-stderr.txt'
                        # WinExe 必须显式等待并检查退出码，不能仅以成功启动判断 smoke 通过。
                        $process = Start-Process -FilePath "$packageRoot/TinyHarness.exe" -ArgumentList '--offline-smoke' `
                          -WindowStyle Hidden -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                        Get-Content -LiteralPath $stdout, $stderr
                        if ($process.ExitCode -ne 0) { throw "Desktop offline smoke failed: $($process.ExitCode)" }
                      }
                    } finally { Pop-Location }
                  }

            - name: Upload the verified CLI and Desktop packages
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.metadata.outputs.package_name }}
                  path: ${{ runner.temp }}/dist/*
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14

            - name: Upload test results
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: windows-test-results-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/test-results/**
                  if-no-files-found: ignore
                  retention-days: 14

    upload-release-assets:
        name: Upload assets to the published release
        needs: build
        if: ${{ github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            actions: read
        steps:
            - name: Download the verified CLI and Desktop packages from this run
              uses: actions/download-artifact@v8
              with:
                  name: ${{ needs.build.outputs.package_name }}
                  path: dist

            - name: Check checksum and upload to the existing release
              shell: bash
              working-directory: dist
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  CLI_PACKAGE_NAME: ${{ needs.build.outputs.cli_package_name }}
                  DESKTOP_PACKAGE_NAME: ${{ needs.build.outputs.desktop_package_name }}
              run: |
                  set -euo pipefail
                  sha256sum --check SHA256SUMS.txt
                  if [ "$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')" != 'false' ]; then
                    echo 'The release must exist and be published before uploading assets.' >&2
                    exit 1
                  fi
                  gh release upload "$RELEASE_TAG" "$CLI_PACKAGE_NAME.zip" "$DESKTOP_PACKAGE_NAME.zip" SHA256SUMS.txt --repo "$GH_REPO"
